<text x="40" y="70" font-family="Arial, sans-serif" font-size="14" fill="#6b7280">사람이 포함된 FINISHED 3인 대국에서 PPO 기준 성적을 누적 막대로 시각화한 결과입니다.</text>
<text x="40" y="92" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">순위 분포는 1등/2등/3등/미집계를 모두 포함하며, 승패 분포는 전체 경기 기준입니다.</text>
