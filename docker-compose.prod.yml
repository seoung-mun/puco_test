# ── 프로덕션 환경 (docker compose -f docker-compose.prod.yml up) ──
# 특징: prebuilt backend image, non-root, healthcheck, 네트워크 격리, 2GB EC2용 리소스 제한
# EC2 사용: docker compose -f docker-compose.prod.yml up -d --no-build
# 로컬/CI 이미지 생성: docker compose -f docker-compose.prod.yml build backend

services:
  db:
    image: postgres:16-alpine
    container_name: puco_db
    cpus: 0.5
    mem_limit: 384m
    mem_reservation: 192m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-puco_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: puco_rl
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-puco_user} -d puco_rl"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.15"
          memory: 192M

  redis:
    image: redis:7-alpine
    container_name: puco_redis
    cpus: 0.2
    mem_limit: 128m
    mem_reservation: 64m
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 96mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 64M

  backend:
    image: castone-backend:${BACKEND_IMAGE_TAG:-prod-preview}
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: puco_backend
    cpus: 1.3
    mem_limit: 1280m
    mem_reservation: 512m
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-puco_user}:${POSTGRES_PASSWORD}@db:5432/puco_rl
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - PYTHONPATH=/app:/PuCo_RL
      - APP_LOG_DIR=/tmp/castone-data/logs
      - DEBUG=false
    expose:
      - "8000"
    volumes:
      - backend_logs:/data/logs
    networks:
      - internal
      - frontend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.3"
          memory: 1280M
        reservations:
          cpus: "0.5"
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: puco_caddy
    cpus: 0.2
    mem_limit: 128m
    mem_reservation: 32m
    environment:
      - PUBLIC_BACKEND_HOST=${PUBLIC_BACKEND_HOST:-localhost}
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M

networks:
  internal:
    driver: bridge
    internal: true
  frontend:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  backend_logs:
  caddy_data:
  caddy_config:
